<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow — Student Productivity Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <header class="app-header">
      <div class="header-inner">
        <div class="logo">
          <svg class="logo-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span class="logo-text">FocusFlow</span>
        </div>
        <p class="tagline">Your offline study task manager</p>
      </div>
    </header>

    <main class="app-main" id="main-content">

      <!-- Add Task Form -->
      <section class="card add-section" aria-label="Add a new task">
        <h2 class="section-title">Add Task</h2>
        <form class="add-form" id="add-form" novalidate>
          <div class="form-row">
            <div class="field field--title">
              <label for="task-title">Task title</label>
              <input
                type="text"
                id="task-title"
                name="task-title"
                placeholder="e.g. Read chapter 5…"
                maxlength="120"
                autocomplete="off"
                aria-required="true"
                aria-describedby="title-error"
              />
              <span class="field-error" id="title-error" role="alert" aria-live="polite"></span>
            </div>

            <div class="field field--priority">
              <label for="task-priority">Priority</label>
              <select id="task-priority" name="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="field field--submit">
              <label class="visually-hidden" for="add-btn">Submit task</label>
              <button type="submit" id="add-btn" class="btn btn--primary">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Add Task
              </button>
            </div>
          </div>
        </form>
      </section>

      <!-- Progress -->
      <section class="card progress-section" aria-label="Task progress">
        <div class="progress-header">
          <span class="progress-label" id="progress-label">0 of 0 tasks completed</span>
          <span class="progress-pct" id="progress-pct" aria-hidden="true">0%</span>
        </div>
        <progress
          id="progress-bar"
          class="progress-bar"
          value="0"
          max="100"
          aria-label="Task completion progress"
          aria-describedby="progress-label"
        ></progress>
      </section>

      <!-- Filter Bar -->
      <section class="filter-section" aria-label="Filter tasks">
        <div class="filter-bar" role="group" aria-label="Show tasks">
          <button
            class="btn btn--filter"
            id="filter-all"
            data-filter="all"
            aria-pressed="true"
          >All</button>
          <button
            class="btn btn--filter"
            id="filter-active"
            data-filter="active"
            aria-pressed="false"
          >Active</button>
          <button
            class="btn btn--filter"
            id="filter-completed"
            data-filter="completed"
            aria-pressed="false"
          >Completed</button>
        </div>
        <button
          class="btn btn--ghost btn--clear"
          id="clear-btn"
          aria-label="Clear all completed tasks"
          hidden
        >
          Clear Completed
        </button>
      </section>

      <!-- Task List -->
      <section aria-label="Task list">
        <ul class="task-list" id="task-list" role="list" aria-live="polite" aria-relevant="additions removals">
          <!-- tasks rendered by app.js -->
        </ul>
        <div class="empty-state" id="empty-state" hidden>
          <svg aria-hidden="true" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="8" y="12" width="48" height="40" rx="4"/>
            <line x1="20" y1="26" x2="44" y2="26"/>
            <line x1="20" y1="34" x2="36" y2="34"/>
          </svg>
          <p id="empty-message">No tasks yet. Add one above!</p>
        </div>
      </section>

    </main>

    <footer class="app-footer">
      <p>FocusFlow &mdash; works offline, no account needed.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
